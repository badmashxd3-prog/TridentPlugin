# =========================================================
#  GodTrident - Configuration
# =========================================================

# Vertical launch power applied when a player Shift + Right
# Clicks with the God Trident in their main hand.
# This is tuned to launch a player roughly 10-15 blocks up.
# Increase it a little for a higher launch, decrease for lower.
# Suggested tuning range: 1.6 (lower/~10 blocks) to 2.1 (higher/~15 blocks).
launch-velocity: 1.9

# Radius (in blocks) of the landing shockwave.
shockwave-radius: 30

# Damage dealt to every other player caught in the shockwave.
# This is intentionally huge so it is lethal enough to trigger
# a Totem of Undying pop on anyone carrying one. Players without
# a totem equipped will die from this, exactly like vanilla lethal damage.
shockwave-damage: 1000

# Cooldown (in seconds) before the ability can be used again.
cooldown-seconds: 5

# Whether the trident holder takes fall damage from the launch. (should stay false)
disable-fall-damage: true

# Whether the trident holder is excluded from their own shockwave.
exclude-self-from-shockwave: true

# Sounds played (must be valid Bukkit Sound enum names for your server version).
# If a name isn't valid on your version, it is safely skipped (logged once).
sounds:
  launch: ENTITY_ENDER_DRAGON_FLAP
  landing: ENTITY_GENERIC_EXPLODE
  totem-warning: ENTITY_ENDER_DRAGON_GROWL

# Particles played (must be valid Bukkit Particle enum names for your server version).
# Fire-themed by default to match the God Trident's glowing red/orange look.
particles:
  launch: FLAME
  landing: LAVA
  landing-ring: FLAME
